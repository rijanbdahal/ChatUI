<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chat UI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="chat-container">
    <div id="chatLogs" class="chat-logs"></div>
    <form id="inputForm" class="chat-form">
      <input
        type="text"
        id="userInput"
        placeholder="Type your message..."
        autocomplete="off"
        autofocus
      />
      <button type="button" id="audioInput">🎤 Start</button>
    </form>
    <button id="deleteChatButton">🗑 Clear Chat</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
